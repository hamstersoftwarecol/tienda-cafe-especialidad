name = "tienda-cafe-especialidad"
compatibility_date = "2026-10-14"

# Configuración de Cloudflare Tunnel y Proxy
[site]
bucket = "./public"

# Enrutamiento y cabeceras perimetrales recomendadas
[env.production]
name = "tienda-cafe-production"
routes = [
  { pattern = "*/*", zone_name = "tudominio.com" }
]
